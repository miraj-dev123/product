<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Ensures the page displays correctly on mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Search Engine Meta Tags (Shows on Google Search results) -->
  <title>Product Calculator - Multiply Two Numbers Online</title>
  <meta name="description" content="Calculate the product of any two numbers quickly with this simple online product calculator. Free and easy to use.">

  <!-- Open Graph Meta Tags (Shows when sharing your link on Facebook, WhatsApp, etc.) -->
  <meta property="og:title" content="Product Calculator - Multiply Two Numbers Online">
  <meta property="og:description" content="Calculate the product of any two numbers quickly with this simple online product calculator.">
  <meta property="og:type" content="website">
</head>
<body>
  <label for="a">Enter first number :</label>
  <input type="number" id="a" step="any" />
  <br/>
  <label for="b">Enter second number :</label>
  <input type="number" id="b" step="any" />
  <br/>
  <button onclick="calculate()">Calculate</button>
  <p id="result"></p>

  <script>
    function calculate() {
      const aStr = document.getElementById('a').value;
      const bStr = document.getElementById('b').value;
      const a = parseFloat(aStr);
      const b = parseFloat(bStr);
      if (isNaN(a) || isNaN(b)) {
        document.getElementById('result').textContent = 'Please enter valid numbers.';
        return;
      }
      const c = a * b;
      document.getElementById('result').textContent = `The product of ${a} and ${b} is ${c} `;
    }
  </script>
  
</body>
</html>
